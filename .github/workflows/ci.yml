name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Also run before a release (see publish.yml)
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # Regression: building from a clone inside the system temp directory
      # (e.g. /tmp in GitLab CI) used to fail with wrong font paths.
      - name: Build from /tmp
        run: |
          cp -r "$GITHUB_WORKSPACE" /tmp/markdown-slides
          cd /tmp/markdown-slides
          npm run build

  test:
    runs-on: ubuntu-latest
    # Same image as `npm run test:docker`, so screenshots match the baselines.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - run: npx playwright test
        env:
          HOME: /root
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14

<section class="slide" id="slide-{{current}}">
  <div class="content">{{{ content }}}</div>
  {{#if footnotes}}
  {{{ footnotes }}}
  {{/if}}
  <div class="footer noprint">
    <span></span>
    <span aria-label="{{t 'page'}} {{current}} {{t 'pageOf'}} {{total}}"
      >{{ current }} / {{ total }}</span
    >
  </div>
</section>

<div class="video">
  <video
    class="{{className}}"
    src="{{src}}"
    aria-label="{{alt}}"{{#if style}} style="{{style}}"{{/if}}
    controls
    onerror="this.classList.add('broken')"
  ></video>

  <div class="video-print-placeholder">
    <img src="app/img/broken-image.svg" alt="">
    <p>
      {{t 'videoNotPrinted'}}
    </p>
    <p>
      {{t 'videoDescription'}} {{ alt }}
    </p>
    <p>
      {{t 'videoLink'}} {{ src }}
    </p>
  </div>
</div>

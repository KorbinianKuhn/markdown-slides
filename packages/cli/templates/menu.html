{{#*inline "toc"}}
<ul>
  {{#each this}}
  <li>
    <a href="#{{slug}}" onclick="onClickCloseMenu()">
      <span>{{title}}</span><span class="slide-number">{{slideNumber}}</span></a
    >
    {{! Use the partial }} {{#if children}} {{> toc children}} {{/if}}
  </li>
  {{/each}}
</ul>
{{/inline}}

<dialog
  id="menu"
  modal-mode="mega"
  aria-label="{{t 'menu'}}"
>
  <header>
    <button onclick="onClickCloseMenu()" aria-label="{{t 'closeMenu'}}" autofocus>
      <svg
        xmlns="http://www.w3.org/2000/svg"
        height="24px"
        viewBox="0 -960 960 960"
        width="24px"
        fill="currentColor"
      >
        <path
          d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z"
        />
      </svg>
    </button>
    {{#if isChild }}
    <a href="index.html" onclick="onClickCloseMenu()">{{ lectureTitle }}</a>
    {{/if}}
    <a href="#" onclick="onClickCloseMenu()">{{ title }}</a>
  </header>
  <article>{{> toc items }}</article>
  <footer>
    <div>
      <button
        onclick="onClickFullscreen()"
        class="noprint nofullscreen nomobile"
        aria-label="{{t 'fullscreenLabel'}}"
      >
        {{t 'fullscreen'}}
      </button>
    </div>
    <div>
      <span>{{t 'version'}}</span>
      <span>{{ date }}</span>
    </div>
    <div>
      <span>{{t 'pdf'}}:</span>
      <span
        ><button
          onclick="onClickPrint()"
          aria-label="{{t 'pdfLabel'}}"
        >
          {{t 'pdf'}}
        </button></span
      >
    </div>
    <div role="group" aria-labelledby="theme-label">
      <span id="theme-label">{{t 'theme'}}</span>
      <button
        id="button-theme-auto"
        onclick="onClickSetTheme('system')"
        title="{{t 'themeAutoTitle'}}"
        aria-pressed="false"
      >
        {{t 'themeAuto'}}
      </button>
      <button
        id="button-theme-light"
        onclick="onClickSetTheme('light')"
        aria-pressed="false"
      >
        {{t 'themeLight'}}
      </button>
      <button
        id="button-theme-dark"
        onclick="onClickSetTheme('dark')"
        aria-pressed="false"
      >
        {{t 'themeDark'}}
      </button>
    </div>
  </footer>
</dialog>
